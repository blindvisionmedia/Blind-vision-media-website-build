risk_levels:
  low:
    examples:
      - copy_change
      - documentation
      - non_sensitive_ui_polish
  medium:
    examples:
      - new_public_form
      - analytics_event
      - non_privileged_api_integration
      - performance_refactor
      - non_sensitive_schema_addition
  high:
    examples:
      - authentication
      - authorization
      - private_file_access
      - client_data_boundaries
      - payments
      - oauth
      - webhooks
      - admin_privileges
      - database_security_policy
      - production_data_migration
  critical:
    examples:
      - privileged_key_exposure
      - cross_tenant_data_exposure
      - auth_bypass
      - arbitrary_code_execution
      - production_secret_leak
      - payment_manipulation
      - destructive_unauthorized_production_action

requirements:
  low:
    independent_security_review: false
    qa_review: false
    human_approval: false
  medium:
    independent_security_review: false
    qa_review: true
    human_approval: false
  high:
    independent_security_review: true
    qa_review: true
    human_approval: true
  critical:
    independent_security_review: true
    qa_review: true
    human_approval: true
    block_merge_until_resolved: true

classification_rule: when_uncertain_choose_higher_until_reviewed
