name: Agent finding

description: Track a non-sensitive audit, QA, architecture, performance, accessibility, or privacy finding.

title: "[FINDING] "

body:
  - type: markdown
    attributes:
      value: |
        Do not place credentials, exploit secrets, or private client data in a public issue. Use the repository's private vulnerability reporting path for sensitive security reports.

  - type: input
    id: finding_id
    attributes:
      label: Finding ID
      placeholder: SEC-001 / QA-001 / ARCH-001
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - critical
        - high
        - medium
        - low
        - info
    validations:
      required: true

  - type: input
    id: category
    attributes:
      label: Category
      placeholder: Authorization / Regression / Accessibility / etc.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Reference files/lines, commits, PRs, tests, workflows, or reproduction steps.
    validations:
      required: true

  - type: textarea
    id: scenario
    attributes:
      label: Failure or abuse scenario
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Impact
    validations:
      required: true

  - type: textarea
    id: recommendation
    attributes:
      label: Recommended remediation
    validations:
      required: true

  - type: textarea
    id: validation
    attributes:
      label: Verification plan
      description: Explain how the original issue will be retested after remediation.
    validations:
      required: true
