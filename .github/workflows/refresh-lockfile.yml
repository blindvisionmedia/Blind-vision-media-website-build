name: Refresh package lock

on:
  push:
    branches:
      - feat/4-public-site-scaffold
    paths:
      - package.json

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/4-public-site-scaffold
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh package-lock.json without running package scripts
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile when changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh npm lockfile"
          git push origin HEAD:feat/4-public-site-scaffold
