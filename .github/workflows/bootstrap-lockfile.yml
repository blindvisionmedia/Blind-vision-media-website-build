name: Bootstrap package lock

on:
  push:
    branches:
      - feat/4-public-site-scaffold

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/4-public-site-scaffold
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Stop when lockfile already exists
        id: lock
        shell: bash
        run: |
          if [[ -f package-lock.json ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate package-lock.json without running package scripts
        if: steps.lock.outputs.exists == 'false'
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile
        if: steps.lock.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: add npm lockfile"
          git push origin HEAD:feat/4-public-site-scaffold

# Bootstrap-only workflow. Remove after the lockfile is committed.
